name: GitHub CI

# Codehaus Plexus build: apache/maven-gh-actions-shared maven-verify.yml@v5 with the settings Plexus
# repositories share. The inputs keep their earlier names so callers need no change; each default
# below must match maven-verify.yml@v5 where it maps to one, so change it here when v5 changes.

on:
  workflow_call:
    inputs:
      maven_args:
        description: The Maven goals and arguments of every build
        required: false
        default: 'verify javadoc:javadoc'
        type: string
      maven-version:
        description: The Maven version of every build
        required: false
        default: '3.10.0'
        type: string
      os-matrix:
        description: 'os matrix as json array'
        required: false
        default: '[ "ubuntu-latest", "windows-latest", "macos-latest" ]'
        type: string
      jdk-matrix:
        description: 'jdk matrix as json array'
        required: false
        default: '[ "21", "25", "8" ]'
        type: string
      matrix-exclude:
        description: 'exclude for matrix as json'
        required: false
        default: '[]'
        type: string
      matrix-include:
        description: 'include for matrix as json; an entry without a "maven" key uses maven-version'
        required: false
        default: '[]'
        type: string
      jdk-distribution-matrix:
        description: 'jdk distribution matrix'
        required: false
        default: '[ "zulu" ]'
        type: string
      jdk-fast-fail-build:
        description: 'jdk fast fail build'
        required: false
        default: '17'
        type: string
      jdk-distribution-fast-fail-build:
        description: 'jdk distribution fast fail build'
        required: false
        default: 'zulu'
        type: string

jobs:
  build:
    name: Verify
    uses: apache/maven-gh-actions-shared/.github/workflows/maven-verify.yml@v5
    with:
      os-matrix: ${{ inputs.os-matrix }}
      jdk-matrix: ${{ inputs.jdk-matrix }}
      matrix-exclude: ${{ inputs.matrix-exclude }}
      matrix-include: ${{ inputs.matrix-include }}
      jdk-distribution-matrix: ${{ inputs.jdk-distribution-matrix }}
      maven-matrix: ${{ format('["{0}"]', inputs.maven-version) }}
      ff-maven: ${{ inputs.maven-version }}
      ff-jdk: ${{ inputs.jdk-fast-fail-build }}
      ff-jdk-distribution: ${{ inputs.jdk-distribution-fast-fail-build }}
      ff-goal: ${{ inputs.maven_args }}
      verify-goal: ${{ inputs.maven_args }}
      # site publishing is manual (RELEASING.md), so CI does not build the site
      ff-site-run: false
      # only the default branch saves the Maven and JDK caches; other branches and pull requests restore them
      cache-save-default-branch-only: true
