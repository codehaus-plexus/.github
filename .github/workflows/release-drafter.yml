name: Release Drafter
on:
  workflow_call:
    inputs:
      config-name:
        description: Configuration file in the calling repository's .github directory
        required: false
        type: string
        default: release-drafter.yml

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    # The draft release needs contents: write, reading merged pull requests
    # needs pull-requests: read. Every calling repo grants both by default.
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@v7.10.0
        with:
          config-name: ${{ inputs.config-name }}
