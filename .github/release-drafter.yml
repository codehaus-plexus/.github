# Configuration for Release Drafter: https://github.com/release-drafter/release-drafter
# Shared by every codehaus-plexus repo via `_extends: .github`.
#
# Every label referenced here exists in labels.js. The reverse does not
# hold and should not: the priority: family, question, help wanted and the
# other triage labels are deliberately absent, because they describe an
# issue's handling rather than a change worth listing in release notes.
# java and github_actions are absent for a different reason - Dependabot
# always applies dependencies alongside them, and that is categorised.
# Note that `categories` is an array: a repo that overrides it via _extends
# replaces the whole array rather than appending to it.
# $RESOLVED_VERSION follows the semver-increment of each category, so a PR
# labelled enhancement drafts a minor and a PR labelled bug drafts a patch. The
# previous $NEXT_PATCH_VERSION always drafted a patch, which meant every minor
# release in the org had to be retitled by hand before publishing. A PR with no
# categorised label drafts a patch, release-drafter's own fallback.
#
# tag-template here is a fallback with no artifact prefix, and no repo should
# rely on it: every repo tags as <artifact>-<version>, so each one overrides
# tag-template and sets tag-prefix to match. Without tag-prefix the drafter
# parses the version out of the tag string as best it can - plexus-i18n drafted
# 18.0.1 once, having read the 18 out of its own name.
name-template: $RESOLVED_VERSION
tag-template: $RESOLVED_VERSION
version-template: $MAJOR.$MINOR.$PATCH

categories:
  - type: pre-exclude
    when:
      labels: [reverted, skip-changelog]
  - title: ":boom: Breaking changes"
    semver-increment: major
    when:
      labels: [breaking]
  - title: 🚨 Removed
    semver-increment: minor
    when:
      labels: [removed]
  - title: 🚀 New features and improvements
    semver-increment: minor
    when:
      labels: [enhancement]
  - title: 🐛 Bug Fixes
    semver-increment: patch
    when:
      labels: [bug]
  - title: 📝 Documentation updates
    semver-increment: patch
    when:
      labels: [documentation]
  - title: 👻 Maintenance
    semver-increment: patch
    when:
      labels: [maintenance]
  - title: 🔧 Build
    semver-increment: patch
    when:
      labels: [build]
  # Applied automatically by Dependabot. This is ~85% of all labelled items in
  # the org, so it is collapsed behind a summary line rather than being allowed
  # to bury every other category.
  - title: 📦 Dependency updates
    semver-increment: patch
    collapse-after: 10
    when:
      labels: [dependencies]

# Dependabot bumps the same dependency several times between releases, most
# often the plexus parent and plexus-testing. Group each dependency into one
# entry with the full version range; $NUMBERS lists every pull request of it.
# group_in keeps a bump in one module apart from the same bump in another.
group-changes:
  - pattern: '/^Bump (?<group>.+?) from (?<from>\S+) to (?<to>\S+)(?<group_in> in \S+)?$/'
    title-template: 'Bump $GROUP from $FIRST_FROM to $LAST_TO$GROUP_IN'

change-template: '- $TITLE ($NUMBERS) @$AUTHOR'

# $RESOLVED_TAG is the tag-template a repo sets, so the link includes its prefix.
template: |
  <!-- Optional: add a release summary here -->
  $CHANGES

  [Full changelog](https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_TAG)
