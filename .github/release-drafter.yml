# Configuration for Release Drafter: https://github.com/release-drafter/release-drafter
# Shared by every codehaus-plexus repo via `_extends: .github`.
#
# Every label referenced here exists in labels.js. The reverse does not
# hold and should not: the priority: family, question, help wanted and the
# other triage labels are deliberately absent, because they describe an
# issue's handling rather than a change worth listing in release notes.
# java and github_actions are absent for a different reason - Dependabot
# always applies dependencies alongside them, and that is categorised.
# Note that `categories` is an array: a repo that overrides it via _extends
# replaces the whole array rather than appending to it.
# $RESOLVED_VERSION follows the version-resolver below, so a PR labelled
# enhancement drafts a minor and a PR labelled bug drafts a patch. The previous
# $NEXT_PATCH_VERSION always drafted a patch, which meant every minor release in
# the org had to be retitled by hand before publishing.
#
# tag-template here is a fallback with no artifact prefix, and no repo should
# rely on it: every repo tags as <artifact>-<version>, so each one overrides
# tag-template and sets tag-prefix to match. Without tag-prefix the drafter
# parses the version out of the tag string as best it can - plexus-i18n drafted
# 18.0.1 once, having read the 18 out of its own name.
name-template: $RESOLVED_VERSION
tag-template: $RESOLVED_VERSION
version-template: $MAJOR.$MINOR.$PATCH

categories:
  - title: ":boom: Breaking changes"
    labels: [breaking]
  - title: 🚨 Removed
    labels: [removed]
  - title: 🚀 New features and improvements
    labels: [enhancement]
  - title: 🐛 Bug Fixes
    labels: [bug]
  - title: 📝 Documentation updates
    labels: [documentation]
  - title: 👻 Maintenance
    labels: [maintenance]
  - title: 🔧 Build
    labels: [build]
  # Applied automatically by Dependabot. This is ~85% of all labelled items in
  # the org, so it is collapsed behind a summary line rather than being allowed
  # to bury every other category.
  - title: 📦 Dependency updates
    labels: [dependencies]
    collapse-after: 10

exclude-labels:
  - reverted
  - skip-changelog

# Derive the next version from the labels already being applied.
version-resolver:
  major:
    labels: [breaking]
  minor:
    labels: [enhancement, removed]
  patch:
    labels: [bug, documentation, maintenance, build, dependencies]
  default: patch

change-template: '- $TITLE ([#$NUMBER]($URL)) @$AUTHOR'

template: |
  <!-- Optional: add a release summary here -->
  $CHANGES
